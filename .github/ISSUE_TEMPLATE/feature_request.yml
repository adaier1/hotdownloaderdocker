name: "功能请求"
description: "建议新功能"
labels: ["enhancement"]

body:
  - type: textarea
    id: feature
    attributes:
      label: "功能描述"
      description: "描述你想要的功能"
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: "使用场景"
      description: "为什么需要此功能"

  - type: textarea
    id: additional
    attributes:
      label: "补充信息"
      description: "其他相关信息、链接或截图"
