[changelog]
# 每个版本的渲染模板
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**破坏性变更**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# 删除 changelog 正文前后的空白
trim = true
# 即使没有可处理的 release 也渲染模板
render_always = true
# 输出文件路径（固定为 CHANGELOG.md）
output = "CHANGELOG.md"

[git]
# 按照 Conventional Commits 规范解析提交
# https://www.conventionalcommits.org
conventional_commits = true
# 排除不符合规范的提交（由于有兜底规则，实际不会全部排除）
filter_unconventional = true
# 不强制所有提交都必须符合规范
require_conventional = false
# 不按换行拆分提交
split_commits = false
# 提交预处理（这里留空，可按需添加）
commit_preprocessors = []
# 保护 breaking 提交不被过滤
protect_breaking_commits = false
# 提交解析规则：决定分组、跳过或标记
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->功能更新" },
    { message = "^fix", group = "<!-- 1 -->Bug 修复" },
    { message = "^doc", group = "<!-- 2 -->文档更新" },
    { message = "^perf", group = "<!-- 3 -->性能优化" },
    { message = "^refactor", group = "<!-- 4 -->重构" },
    { message = "^style", group = "<!-- 5 -->代码风格" },
    { message = "^test", group = "<!-- 6 -->测试" },
    # 以下这些 chore 提交不会出现在 changelog 中
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    # 其他 chore 和 ci 提交归入“其他杂项”
    { message = "^chore|^ci|^build", group = "<!-- 7 -->其他杂项" },
    # 安全相关提交（通过正文识别）
    { body = ".*security", group = "<!-- 8 -->安全修复" },
    { message = "^revert", group = "<!-- 9 -->回滚" },
    # 兜底：所有未匹配的提交归入“未分类”
    { message = ".*", group = "<!-- 10 -->未分类" },
]
# 不排除未被任何解析器匹配的提交
filter_commits = false
# 不因未匹配提交而报错
fail_on_unmatched_commit = false
# 链接解析器（留空）
link_parsers = []
# 只使用当前分支的标签
use_branch_tags = false
# 按时间顺序排列 release
topo_order = false
# 按拓扑顺序排列提交（可改为 false 按时间顺序）
topo_order_commits = true
# 提交排序方式：oldest（从旧到新）
sort_commits = "oldest"
# 处理子模块提交
recurse_submodules = false
