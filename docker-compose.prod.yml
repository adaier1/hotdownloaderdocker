# ============================================================
# HotDownloader — 使用已发布单镜像安装（无需本地构建）
#
# 镜像：ghcr.io/adaier1/hotdownloaderdocker
#
# 默认账号：admin / admin123（未配置 AUTH_* 时自动使用）。
# 首次登录后可在「设置 → 安全设置」中修改密码（保存到 /data/auth.json）。
# 如需自定义初始凭据，可设置 AUTH_USERNAME/AUTH_PASSWORD 或 HOTDOWNLOADER_TOKEN
# （仅在 auth.json 不存在时生效）。忘记密码时删除 ./data/auth.json 后重启即可恢复。
#
# 启动：docker compose -f docker-compose.prod.yml up -d
# 访问：http://<主机IP>:8080
#
# 若 GHCR 上的包为私有，请先登录：
#   docker login ghcr.io -u <你的GitHub用户名>
#
# 可用环境变量：IMAGE_TAG / WEB_PORT / DATA_PATH / DOWNLOAD_PATH / TZ
# ============================================================

services:
  hotdownloader:
    image: ghcr.io/adaier1/hotdownloaderdocker:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: hotdownloader
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8787"
    environment:
      HOTDOWNLOADER_BIND: 0.0.0.0:8787
      HOTDOWNLOADER_DATA_DIR: /data
      HOTDOWNLOADER_WEB_DIR: /app/dist
      HOTDOWNLOADER_DOWNLOAD_DIR: /downloads
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      HOTDOWNLOADER_TOKEN: ${HOTDOWNLOADER_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
