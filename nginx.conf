# HotDownloader Web 前端 Nginx 配置
# 静态资源托管 + /api 反向代理到 Rust API 服务（compose 中服务名为 server）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由回退（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rust API 服务反向代理
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：/api/events 为 SSE 事件流，必须关闭缓冲，保证实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源缓存（构建产物带 hash，可安全长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
