[package]
name = "hotdownloader-server"
version = "1.3.0"
description = "HotDownloader Rust API 服务（Web 架构后端）"
authors = ["lerdb"]
license = "Apache-2.0"
repository = "https://github.com/lerdb/HotDownloader"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "hotdownloader-server"
path = "src/main.rs"

[dependencies]
# Web 框架与异步运行时
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# 序列化 / 日志
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# HTTP 客户端（音乐平台接口、下载引擎）
reqwest = { version = "0.12", features = [
    "stream",
    "json",
    "rustls-tls",
    "gzip",
    "cookies",
], default-features = false }
url = "2.5"
urlencoding = "2.1"

# QQ 加密音频解密库（git 子模块，随仓库一起分发）
umc_qmc = { path = "../libs/um_crypto/um_crypto/qmc" }

once_cell = "1.21"
flate2 = "1.1"
regex = "1.13"
lofty = "0.22"

# QQ 登录（WebSocket + MQTT）
async-tungstenite = { version = "0.32", features = [
    "tokio-runtime",
    "tokio-rustls-webpki-roots",
] }
rumqttc = { version = "0.25", default-features = false, features = [
    "use-rustls-no-provider",
] }
bytes = "1.12"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
base64 = "0.23.1"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
